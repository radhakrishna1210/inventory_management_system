{% extends 'admin_base.html' %}

{% block content %}
    <h2>Create New Bill (Manual Entry)</h2>
    <form method="POST" action="{{ url_for('admin.create_bill') }}">
        <div class="form-group">
            <label for="customer_name">Customer Name:</label>
            <input type="text" id="customer_name" name="customer_name" required>
        </div>
        
        <table id="bill-items">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
        
        <button type="button" onclick="addItemRow()">+ Add Item</button>
        
        <hr>
        <div class="form-grid-small">
            <label for="tax_percentage">Tax (%):</label>
            <input type="number" step="0.01" id="tax_percentage" name="tax_percentage" value="0">
            
            <label for="discount_amount">Discount ($):</label>
            <input type="number" step="0.01" id="discount_amount" name="discount_amount" value="0">
        </div>
        <hr>
        
        <button type="submit">Generate Bill</button>
    </form>
{% endblock %}

{% block scripts %}
<script id="billing-data" data-products='{{ products_json|safe }}'></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const billingScriptTag = document.getElementById('billing-data');
        const products = JSON.parse(billingScriptTag.getAttribute('data-products'));

        // Make the function available globally so the button can call it
        window.addItemRow = function() {
            const tbody = document.querySelector('#bill-items tbody');
            const row = document.createElement('tr');
            
            let options = '<option value="">-- Select Product --</option>';
            products.forEach(p => {
                options += `<option value="${p.id}">${p.name} (Stock: ${p.stock})</option>`;
            });

            row.innerHTML = `
                <td><select name="product_id[]" required>${options}</select></td>
                <td><input type="number" name="quantity[]" value="1" min="1" required></td>
                <td><button type="button" class="btn-delete" onclick="this.parentElement.parentElement.remove()">X</button></td>
            `;
            tbody.appendChild(row);
        }

        // Add the first row automatically when the page loads
        addItemRow();
    });
</script>
{% endblock %}
