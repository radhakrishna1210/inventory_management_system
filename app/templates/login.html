{% extends 'shop_base.html' %}

{% block content %}
<div class="login-container">
    
    <form method="POST" action="{{ url_for('main.admin_login') }}" class="login-form" novalidate>
        {{ form.hidden_tag() }}
        
        <h2>Admin Login</h2>
        
        <div class="form-group">
            {{ form.username.label }}
            {{ form.username(class="form-control") }}
        </div>
        
        <div class="form-group">
            {{ form.password.label }}
            {{ form.password(class="form-control") }}
        </div>
        
        {{ form.submit(class="btn-primary") }}
    </form>
</div>
{% endblock %}
